<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>自定义组件示例</title>
  <style>html,body{margin:0;padding:0;background:transparent;font-family:system-ui,sans-serif;color:#27272e}main{padding:16px;border:1px solid #dddde4;border-radius:8px}h2{font-size:18px;margin:0 0 8px}p{font-size:14px;margin:8px 0}button{background:#5869de;color:white;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}#details{padding-top:12px}</style>
</head>
<body><main><h2 id="name">商品</h2><p id="price">请选择商品</p><button id="toggle" type="button" aria-expanded="false">展开详情</button><div id="details" hidden><p>随时管理订阅</p><p>查看当前商品权益</p></div></main><script src="./app.js"></script></body>
</html>
