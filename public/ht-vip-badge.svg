<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 54" role="img" aria-label="VIP badge">
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ffe34c"/>
      <stop offset="1" stop-color="#ffab00"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#064a9d" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="92" height="48" rx="14" fill="url(#gold)" filter="url(#shadow)"/>
  <text x="48" y="36" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="900" font-style="italic">VIP</text>
</svg>
